name: ACARS takeoff bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two at once: they would share state.json.
concurrency:
  group: acars-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll VATSIM and send telex
        env:
          HOPPIE_LOGON: ${{ secrets.HOPPIE_LOGON }}
          CALLSIGN_REGEX: "^CVY[0-9]"
          FROM_STATION: COMPANY
        run: python acars_bot.py
      - name: Save state
        run: |
          git config user.name "acars-bot"
          git config user.email "acars-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
