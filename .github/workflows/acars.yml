name: ACARS takeoff bot

on:
  schedule:
    # Off the :00/:05 marks, which GitHub's scheduler delays most.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two at once: they would share state.json.
concurrency:
  group: acars-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # a flight can run for hours; this is GitHub's maximum
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Write ads.json from secret
        env:
          ADS_JSON: ${{ secrets.ADS_JSON }}
        run: printf '%s' "$ADS_JSON" > ads.json
      - name: Poll VATSIM and send telex
        env:
          HOPPIE_LOGON: ${{ secrets.HOPPIE_LOGON }}
          CALLSIGN_REGEX: "^CVY[0-9]"
          FROM_STATION: ${{ vars.FROM_STATION || 'COMPANY' }}
          EXTRA_CALLSIGNS: ${{ vars.EXTRA_CALLSIGNS }}
        run: python -u acars_bot.py  # -u: unbuffered, so the log shows progress while the run is live
      - name: Save state
        if: ${{ always() }}  # still commit progress if the flight run hits the timeout
        run: |
          git config user.name "acars-bot"
          git config user.email "acars-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
